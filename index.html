<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050609"><meta name="description" content="별과 구름, 노을빛을 담은 체스보드. 흑요석과 금빛 유리로 만든 인터랙티브 3D 디오라마."><title>Celestial Chess — 별과 노을</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=capture-direction-2"></head>
<body><main id="world" aria-label="별과 노을의 체스 디오라마"></main><p id="status" role="status">빛을 담는 중…</p><aside id="placement-help" aria-label="체스말 배치"><div class="game-info"><strong id="game-state">백 차례</strong><span class="move-legend">● 이동 가능 <i>◯ 잡기 가능</i></span><p id="placement-status" role="status" aria-live="polite">내 차례의 말을 선택하세요. 표시된 칸으로만 이동할 수 있습니다.</p><div id="legal-moves" aria-label="이동 가능한 타일" hidden></div></div><button id="cancel-selection" type="button" hidden>선택 취소 <span>Esc</span></button><button id="new-game" type="button">새 게임</button></aside><dialog id="promotion-dialog" aria-labelledby="promotion-title"><h2 id="promotion-title">폰 승격</h2><p>승격할 말을 선택하세요.</p><div class="promotion-options"><button type="button" data-promotion="q">퀸</button><button type="button" data-promotion="r">룩</button><button type="button" data-promotion="b">비숍</button><button type="button" data-promotion="n">나이트</button></div></dialog><footer><span>클릭 선택·이동 <i>·</i> 드래그 회전 <i>·</i> 스크롤 확대</span><button id="reset" type="button" title="처음 구도로 돌아가기 (R)" aria-label="처음 구도로 돌아가기">↺ <span>처음 구도</span></button></footer><noscript>3D 디오라마를 보려면 JavaScript를 켜 주세요.</noscript><script type="module" src="main.js?v=peach-crystal-3"></script></body>
